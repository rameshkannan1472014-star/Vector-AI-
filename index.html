<body>
    <div class="app-container">
        <!-- DASHBOARD VIEW -->
        <div class="screen-view active" id="view-dashboard">
            <div class="top-nav">
                <div class="nav-left">
                    <div class="robot-avatar"><i class="fa-solid fa-robot" style="color: white; font-size: 16px;"></i></div>
                    <div>
                        <div style="font-size: 15px; font-weight: 700;">Engineer AI</div>
                        <div style="font-size: 10px; color: #64748B;">Professional Engineering Assistant</div>
                    </div>
                </div>
                <div class="user-avatar">R<div class="status-dot"></div></div>
            </div>

            <div class="hero-banner">
                <h3 style="font-size: 18px;">Hello! 👋</h3>
                <p style="font-size: 11px; color: #94A3B8; margin-top: 2px;">Ask any engineering question or request a circuit diagram.</p>
                <div class="prompt-bar">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color: #3B82F6;"></i>
                    <input type="text" id="main-prompt-input" placeholder="Ask Engineer AI anything...">
                    <i class="fa-solid fa-paper-plane" style="color: #3B82F6; cursor: pointer;" onclick="handleDashboardSend()"></i>
                </div>
            </div>
        </div>

        <!-- AI CHAT VIEW -->
        <div class="screen-view" id="view-chat">
            <div class="top-nav">
                <div class="nav-left">
                    <i class="fa-solid fa-chevron-left" style="cursor:pointer;" onclick="showScreen('view-dashboard')"></i>
                    <span style="font-weight:700; margin-left: 8px;">Engineer AI Chat</span>
                </div>
            </div>
            <div id="chat-messages-container" style="flex:1; background:#080E1A; border:1px solid #162032; border-radius:12px; padding:12px; font-size:12px; overflow-y:auto; margin-bottom: 8px;">
                <p style="color:#3B82F6;"><strong>Engineer AI:</strong> Ask me any engineering question or request a diagram.</p>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-tab-input" placeholder="Type your prompt...">
                <button class="chat-send-btn" onclick="handleChatSend()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <div class="nav-tab active" onclick="showScreen('view-dashboard')" id="tab-dashboard"><i class="fa-solid fa-house"></i><span>Home</span></div>
            <div class="nav-tab" onclick="showScreen('view-chat')" id="tab-chat"><div class="chat-btn-glow"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen-view').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');

            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            if (screenId === 'view-dashboard') document.getElementById('tab-dashboard')?.classList.add('active');
            if (screenId === 'view-chat') document.getElementById('tab-chat')?.classList.add('active');
        }

        const BACKEND_URL = "/api/chat";

        function parseAndFormatResponse(rawText) {
            let text = rawText;

            // AUTO-REPAIR: Detect raw graph strings (like 'graph TD A["..."] B-->C') without backticks and convert them to mermaid blocks
            if (!text.includes('```mermaid')) {
                const graphMatch = text.match(/(graph\s+(?:TD|LR|TB|RL)[\s\S]*?)(?=\n\s*\n|\n[A-Z][a-z]+:|$)/i);
                if (graphMatch) {
                    text = text.replace(graphMatch[1], '\n```mermaid\n' + graphMatch[1].trim() + '\n```\n');
                }
            }

            const container = document.createElement('div');
            const mermaidRegex = /```mermaid([\s\S]*?)```/gi;
            let lastIndex = 0;
            let match;

            while ((match = mermaidRegex.exec(text)) !== null) {
                const textBefore = text.substring(lastIndex, match.index);
                if (textBefore.trim()) {
                    container.appendChild(createFormattedTextNode(textBefore));
                }

                let mermaidCode = match[1].trim();

                // Convert single-line diagram definitions into proper multi-line code for Mermaid
                if (!mermaidCode.includes('\n')) {
                    mermaidCode = mermaidCode
                        .replace(/(graph\s+[A-Z]{2})/i, '$1\n')
                        .replace(/\s+([A-Z0-9_-]+\[)/g, '\n$1')
                        .replace(/\s+([A-Z0-9_-]+\s*-->)/g, '\n$1');
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'mermaid-wrapper';
                
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = mermaidCode;
                
                wrapper.appendChild(mermaidDiv);
                container.appendChild(wrapper);

                lastIndex = mermaidRegex.lastIndex;
            }

            const remainingText = text.substring(lastIndex);
            if (remainingText.trim()) {
                container.appendChild(createFormattedTextNode(remainingText));
            }

            return container;
        }

        function createFormattedTextNode(text) {
            const div = document.createElement('div');
            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            div.innerHTML = formatted;
            return div;
        }

        async function sendPrompt(promptText) {
            if (!promptText.trim()) return;

            showScreen('view-chat');
            const chatContainer = document.getElementById('chat-messages-container');
            
            const userMsg = document.createElement('div');
            userMsg.style.cssText = "color: #3B82F6; margin-top: 10px;";
            userMsg.innerHTML = `<strong>You:</strong> ${escapeHtml(promptText)}`;
            chatContainer.appendChild(userMsg);

            const loadingMsg = document.createElement('div');
            loadingMsg.id = 'loading-msg';
            loadingMsg.style.cssText = "color: #94A3B8; margin-top: 6px;";
            loadingMsg.innerHTML = `<em>Engineer AI generating response...</em>`;
            chatContainer.appendChild(loadingMsg);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();
                document.getElementById('loading-msg')?.remove();

                if (data.response) {
                    const aiMsgContainer = document.createElement('div');
                    aiMsgContainer.style.cssText = "color: #E2E8F0; margin-top: 10px;";
                    aiMsgContainer.innerHTML = `<strong>Engineer AI:</strong>`;
                    
                    const parsedContent = parseAndFormatResponse(data.response);
                    aiMsgContainer.appendChild(parsedContent);
                    chatContainer.appendChild(aiMsgContainer);

                    setTimeout(async () => {
                        try {
                            const elements = aiMsgContainer.querySelectorAll('.mermaid');
                            if (elements.length > 0) {
                                await mermaid.run({ nodes: elements });
                            }
                        } catch (e) {
                            console.error("Mermaid Render Error:", e);
                        }
                    }, 100);

                } else {
                    chatContainer.innerHTML += `<p style="color: #EF4444; margin-top: 6px;"><strong>Error:</strong> Empty response.</p>`;
                }
            } catch (err) {
                document.getElementById('loading-msg')?.remove();
                chatContainer.innerHTML += `<p style="color: #EF4444; margin-top: 6px;"><strong>Error:</strong> Failed to connect to server.</p>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function handleDashboardSend() {
            const input = document.getElementById('main-prompt-input');
            if (input && input.value.trim()) {
                sendPrompt(input.value);
                input.value = '';
            }
        }

        function handleChatSend() {
            const input = document.getElementById('chat-tab-input');
            if (input && input.value.trim()) {
                sendPrompt(input.value);
                input.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('main-prompt-input')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleDashboardSend();
            });
            document.getElementById('chat-tab-input')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleChatSend();
            });
        });
    </script>
</body>
</html>
